name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || (github.actor == github.repository_owner && github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, homelink-xiaozhi-mcp-ci]
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Configure runner-local caches
        shell: bash
        run: |
          set -euo pipefail
          printf 'npm_config_cache=%s/npm-cache/homelink-xiaozhi-mcp\n' "${RUNNER_TOOL_CACHE:?}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run audit:dependencies
